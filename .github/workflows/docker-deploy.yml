name: Docker Build and Deploy

on:
  push:
    branches: ["viciouspear", "v1.1"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: https://index.docker.io/v1/  # Явно указываем Docker Hub
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/logic.Dockerfile
          push: true
          tags: viciouspear/logic:latest

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: '${{ secrets.SSH_PRIVATE_KEY }}'

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SERVER_IP }} << 'EOF'
            echo "✅ Connected to server"
            docker pull viciouspear/logic:latest
            docker stop logic_service || true
            docker rm logic_service || true
            docker run -d --name logic_service -p 8002:8002 viciouspear/logic:latest
            echo "✅ Deployment completed"
          EOF