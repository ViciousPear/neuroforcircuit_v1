name: Docker Build and Deploy

on:
  push:
    branches: ["viciouspear", "v1.1"] # Триггер на изменения в ветке main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: viciouspear
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: viciouspear/logic:latest

      - name: SSH into server and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull viciouspear/logic:latest
            docker stop logic_service || true
            docker rm logic_service|| true
            docker run -d --name logic_service -p 8002:8002 viciouspear/logic:latest